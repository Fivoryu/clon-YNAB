services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ynab_dev
      POSTGRES_USER: ynab
      POSTGRES_PASSWORD: ynab_local
    volumes:
      - ynab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ynab -d ynab_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ynab-postgres-data:
