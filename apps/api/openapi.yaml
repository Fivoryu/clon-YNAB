openapi: 3.0.3
info:
  title: YNAB first-slice API
  version: 1.0.0
  description: >-
    The bounded slice supports cash and checking accounts, account lifecycle,
    same-budget transfers, categories, realized income, explicit income release,
    categorized spending, assignments, unassignments, moves, monthly summaries,
    dashboard values, transaction history, and manual CSV import/export. Splits, cards, reconciliation, targets,
    scheduled transactions, future income, refunds, reimbursements, returns, and
    cleared/pending/uncleared states remain unsupported and are not part of this contract.
    Bank-provider simulation is a fictional local simulation only: no network, credentials are not accepted, provider connectivity, no real money, and no financial effects are accepted; candidate application is deferred.
servers:
  - url: /
paths:
  /api/v1/auth/register:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      summary: Register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/UserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/sign-in:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      summary: Sign in
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignInInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SessionSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/sign-out:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      summary: Revoke the session cookie when present
      description: The sid cookie is optional; the server returns success and clears it.
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
  /api/v1/budgets:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      summary: Resume the authenticated owner's budget
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create the authenticated owner's budget
      security: [{ cookieAuth: [] }]
      responses:
        '201': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    get:
      summary: Read a budget
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save resumable setup state
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/accounts:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Create a manual account after setup
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/AccountSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/accounts/{accountId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    patch:
      summary: Rename an account
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/AccountSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/accounts/{accountId}/archive:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Archive an account; unarchive is not supported
      security: [{ cookieAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, maxProperties: 0 } } } }
      responses:
        '200': { $ref: '#/components/responses/AccountSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/categories:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    post:
      summary: Create a category
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/BudgetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/categories/{categoryId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/CategoryId' }]
    patch:
      summary: Rename a category
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/categories/{categoryId}/archive:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/CategoryId' }]
    post:
      summary: Archive a category
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/income:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Record realized income
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IncomeInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/income/{incomeId}/release:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IncomeId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Explicitly release full income
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/spending:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Record categorized spending
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpendingInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/transfers:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Record a same-budget account transfer
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/TransferSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/transactions/export:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    get:
      summary: Export effective supported transaction history as canonical CSV
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Canonical UTF-8 RFC 4180 CSV with CRLF record endings.
          headers:
            Content-Disposition: { description: Deterministic download filename., schema: { type: string } }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/transactions/import:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Atomically import supported transactions from canonical CSV
      description: Synchronous all-or-nothing import. Maximum 10 MiB, 5000 data rows, and 1000 returned diagnostics. The exact header is date,type,account,amountMinor,category,payee,memo. Transfers encode account as sourceAccountId=>destinationAccountId.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/CsvImportSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/transactions:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    get:
      summary: List effective transaction history
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MonthOptional' }, { $ref: '#/components/parameters/HistoryAccount' }, { $ref: '#/components/parameters/HistoryKind' }, { $ref: '#/components/parameters/HistoryCategory' }, { $ref: '#/components/parameters/HistoryFrom' }, { $ref: '#/components/parameters/HistoryTo' }, { $ref: '#/components/parameters/HistoryQuery' }]
      responses:
        '200': { $ref: '#/components/responses/TransactionListSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/transactions/{transactionId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/TransactionId' }]
    get:
      summary: Read one effective transaction
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/TransactionSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit an eligible transaction
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionEditInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/TransactionSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete an eligible transaction after explicit confirmation
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionDeleteInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/DeleteSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/allocations:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Assign money
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/allocations/unassign:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Unassign money
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/allocations/move:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Move assignment between categories
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoveInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/summary:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/Month' }]
    get:
      summary: Read the canonical monthly financial summary
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SummarySuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/Month' }]
    get:
      summary: Read canonical dashboard values
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SummarySuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/simulations/profiles:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    get:
      summary: List fictional local simulation profiles
      description: Fictional/local simulation metadata only; no network, credentials, provider affiliation, no real money, and no financial effects.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/SimulationIdempotencyKey' }]
    post:
      summary: Create a local simulation run
      description: Creates a disconnected deterministic fixture run. Credentials, endpoints, network/provider data, and financial transaction fields are rejected.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationCreateInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/SimulationSuccess' }
        '400': { $ref: '#/components/responses/SimulationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/start:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/SimulationIdempotencyKey' }, { $ref: '#/components/parameters/SimulationIfMatch' }]
    post:
      summary: Start a local simulation run
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationControlInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '400': { $ref: '#/components/responses/SimulationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/advance:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/SimulationIdempotencyKey' }, { $ref: '#/components/parameters/SimulationIfMatch' }]
    post:
      summary: Advance one deterministic fixture transition
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationControlInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '400': { $ref: '#/components/responses/SimulationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/retry:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/SimulationIdempotencyKey' }, { $ref: '#/components/parameters/SimulationIfMatch' }]
    post:
      summary: Retry a fixture-legal failed, timed-out, or partial run
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationControlInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '400': { $ref: '#/components/responses/SimulationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }]
    get:
      summary: Read simulation run status
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/candidates:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }]
    get:
      summary: Read side-effect-free candidate projections
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/checkpoints:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }]
    get:
      summary: Read ordered simulation checkpoints
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/audit:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }]
    get:
      summary: Read ordered simulation audit entries
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/budgets/{budgetId}/simulations/runs/{runId}/inspect:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/SimulationIdempotencyKey' }, { $ref: '#/components/parameters/SimulationIfMatch' }]
    post:
      summary: Inspect one audited simulation projection
      description: Records an idempotent inspect audit activity without changing run state or simulation revision.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationInspectInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SimulationSuccess' }
        '400': { $ref: '#/components/responses/SimulationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly SameSite=Lax Path=/ session cookie; Secure is added in production.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID; every success and error envelope returns requestId.
      schema: { type: string }
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    IncomeId:
      name: incomeId
      in: path
      required: true
      schema: { type: string }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    Month:
      name: month
      in: query
      required: true
      description: Monthly view in YYYY-MM format.
      schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
    MonthOptional:
      name: month
      in: query
      required: false
      description: Optional history filter in YYYY-MM format; repeated or unknown query keys are rejected.
      schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
    HistoryAccount: { name: account, in: query, required: false, description: Canonical server-owned account UUID; transfers match either side., schema: { type: string, format: uuid } }
    HistoryKind: { name: kind, in: query, required: false, schema: { type: string, enum: [INCOME, SPENDING, TRANSFER] } }
    HistoryCategory: { name: category, in: query, required: false, description: Canonical server-owned category UUID., schema: { type: string, format: uuid } }
    HistoryFrom: { name: from, in: query, required: false, description: Inclusive YYYY-MM-DD lower bound., schema: { type: string, format: date, pattern: '^\\d{4}-\\d{2}-\\d{2}$' } }
    HistoryTo: { name: to, in: query, required: false, description: Inclusive YYYY-MM-DD upper bound., schema: { type: string, format: date, pattern: '^\\d{4}-\\d{2}-\\d{2}$' } }
    HistoryQuery: { name: q, in: query, required: false, description: Literal case-insensitive substring over metadata and current server names; maximum 200 Unicode code points., schema: { type: string, maxLength: 200 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for financial commands; the same key and payload replay the stored result.
      schema: { type: string, minLength: 1 }
    SimulationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for simulation create/control/inspect; identical canonical payloads replay without another attempt or revision.
      schema: { type: string, minLength: 1, maxLength: 128 }
    SimulationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected simulation revision, not the financial budget version; weak or quoted integer syntax is accepted.
      schema: { type: string, pattern: '^(?:[0-9]+|"[0-9]+"|W/"[0-9]+")$' }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional expected version for legacy-compatible commands; stale expected versions return 409. Weak or quoted integer ETags are accepted.
      schema: { type: string }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Required expected budget version for account and transfer commands. Weak or quoted integer ETags are accepted.
      schema: { type: string, pattern: '^(?:[0-9]+|"[0-9]+"|W/"[0-9]+")$' }
  responses:
    UserSuccess: { description: Registered user, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    SessionSuccess: { description: Authenticated session; also sets the sid cookie, headers: { Set-Cookie: { description: Session cookie, schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
    EmptySuccess: { description: Session revoked and cookie cleared, headers: { Set-Cookie: { description: Cleared session cookie, schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } } } }
    BudgetSuccess: { description: Budget state, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetEnvelope' } } } }
    AccountSuccess: { description: Account mutation result, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
    TransferSuccess: { description: Transfer result, content: { application/json: { schema: { $ref: '#/components/schemas/TransferEnvelope' } } } }
    FinancialSuccess: { description: Financial command result, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialEnvelope' } } } }
    TransactionListSuccess: { description: Effective transaction history, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionListEnvelope' } } } }
    TransactionSuccess: { description: Effective transaction result, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionEnvelope' } } } }
    DeleteSuccess: { description: Deleted transaction result, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteEnvelope' } } } }
    SummarySuccess: { description: Monthly summary, content: { application/json: { schema: { $ref: '#/components/schemas/SummaryEnvelope' } } } }
    ValidationError: { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthenticated: { description: Authentication required or credentials invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: State or concurrency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    SimulationSuccess: { description: Simulation result envelope; data contains only isolated local simulation projections., content: { application/json: { schema: { $ref: '#/components/schemas/SimulationSuccessEnvelope' } } } }
    SimulationError: { description: Safe simulation validation or persistence error without SQL, credentials, network details, or foreign-resource existence., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    CsvImportSuccess: { description: CSV import committed atomically, content: { application/json: { schema: { $ref: '#/components/schemas/CsvImportEnvelope' } } } }
    UnsupportedMediaType: { description: CSV import requires text/csv with optional charset=utf-8, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    InternalError: { description: Unexpected internal failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string, minLength: 1, description: Non-empty request ID }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, enum: [UNAUTHENTICATED, NOT_FOUND, CONFLICT, VALIDATION_ERROR, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR] }
            details: { $ref: '#/components/schemas/CsvImportDetails' }
            message: { type: string }
            requestId: { type: string, minLength: 1, description: Non-empty request ID }
    CsvDiagnostic: { type: object, required: [row, field, code, message], properties: { row: { type: integer, minimum: 0 }, field: { type: string }, code: { type: string }, message: { type: string } } }
    CsvImportDetails: { type: object, required: [rows, accepted, rejected, diagnostics, diagnosticsTruncated], properties: { rows: { type: integer, minimum: 0 }, accepted: { type: integer, minimum: 0 }, rejected: { type: integer, minimum: 0 }, diagnostics: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/CsvDiagnostic' } }, diagnosticsTruncated: { type: boolean } } }
    CsvImportResult: { allOf: [{ $ref: '#/components/schemas/CsvImportDetails' }], type: object, required: [version], properties: { version: { type: integer, minimum: 0 } } }
    CsvImportEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { $ref: '#/components/schemas/CsvImportResult' } } }
    SimulationRunState: { type: string, enum: [DISCONNECTED, CONNECTING, CONNECTED, SYNCING, PARTIAL, FAILED, TIMED_OUT, SUCCEEDED] }
    SimulationCandidateStatus: { type: string, enum: [PENDING, POSTED, DUPLICATE, REJECTED] }
    SimulationProfile: { type: object, required: [code, displayLabel, description, fixtureVersion, enabled], properties: { code: { type: string, maxLength: 128 }, displayLabel: { type: string, maxLength: 128 }, description: { type: string, maxLength: 512 }, fixtureVersion: { type: string, maxLength: 128 }, enabled: { type: boolean } } }
    SimulationCreateInput: { type: object, required: [profileCode, fixtureVersion, seed], additionalProperties: false, properties: { profileCode: { type: string, maxLength: 128 }, fixtureVersion: { type: string, maxLength: 128 }, seed: { type: string, minLength: 1, maxLength: 128 } }, description: No credentials, endpoints, URLs, provider metadata, or financial transaction fields. }
    SimulationControlInput: { type: object, additionalProperties: false, maxProperties: 0 }
    SimulationInspectInput: { type: object, required: [view], additionalProperties: false, properties: { view: { type: string, enum: [STATUS, CANDIDATES, CHECKPOINTS, AUDIT] } } }
    SimulationRun: { type: object, required: [runId, state, cursor, revision, processedRecordCount], properties: { runId: { type: string }, state: { $ref: '#/components/schemas/SimulationRunState' }, cursor: { type: integer, minimum: 0 }, revision: { type: integer, minimum: 0 }, processedRecordCount: { type: integer, minimum: 0 }, commandCount: { type: integer, minimum: 0 }, attemptCount: { type: integer, minimum: 0 }, profileCode: { type: string }, fixtureVersion: { type: string }, seed: { type: string, maxLength: 128 }, lastDiagnostic: { $ref: '#/components/schemas/SimulationDiagnostic' } } }
    SimulationDiagnostic: { type: object, required: [code, message], properties: { code: { type: string, maxLength: 64 }, message: { type: string, maxLength: 512 } } }
    SimulationCandidate: { type: object, required: [id, runId, status, sourceRecordId, businessDate, amountMinor, provenance, lifecycle], properties: { id: { type: string }, runId: { type: string }, status: { $ref: '#/components/schemas/SimulationCandidateStatus' }, sourceRecordId: { type: string, maxLength: 128 }, businessDate: { type: string, format: date }, amountMinor: { type: integer, minimum: 1 }, payee: { type: string, nullable: true }, memo: { type: string, nullable: true }, provenance: { type: object }, lifecycle: { type: array, maxItems: 5000, items: { type: object } } } }
    SimulationCheckpoint: { type: object, required: [id, sequence, cursor, state, processedRecordCount], properties: { id: { type: string }, sequence: { type: integer, minimum: 1 }, cursor: { type: integer, minimum: 0 }, state: { $ref: '#/components/schemas/SimulationRunState' }, processedRecordCount: { type: integer, minimum: 0 } } }
    SimulationAudit: { type: object, required: [id, sequence, actorId, budgetId, runId, requestId, command, priorState, resultingState, outcome], properties: { id: { type: string }, sequence: { type: integer, minimum: 1 }, actorId: { type: string }, budgetId: { type: string }, runId: { type: string }, "requestId": { type: string, minLength: 1 }, command: { type: string }, priorState: { $ref: '#/components/schemas/SimulationRunState' }, resultingState: { $ref: '#/components/schemas/SimulationRunState' }, outcome: { type: string } } }
    SimulationProjection: { type: object, properties: { run: { $ref: '#/components/schemas/SimulationRun' }, candidates: { type: array, items: { $ref: '#/components/schemas/SimulationCandidate' } }, checkpoints: { type: array, items: { $ref: '#/components/schemas/SimulationCheckpoint' } }, audits: { type: array, items: { $ref: '#/components/schemas/SimulationAudit' } } } }
    SimulationResult: { allOf: [{ $ref: '#/components/schemas/SimulationProjection' }], type: object, properties: { outcome: { type: string }, simulationRevision: { type: integer, minimum: 0 }, replayed: { type: boolean } } }
    SimulationSuccessEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { oneOf: [{ $ref: '#/components/schemas/SimulationResult' }, { $ref: '#/components/schemas/SimulationProfile' }, { $ref: '#/components/schemas/SimulationProjection' }] } } }
    User: { type: object, required: [id, email], properties: { id: { type: string }, email: { type: string, format: email } } }
    Session: { type: object, required: [user, sessionToken], properties: { user: { $ref: '#/components/schemas/User' }, sessionToken: { type: string, description: Opaque session token returned for this first slice } } }
    Account: { type: object, required: [id, name, kind, archived, openingBalanceMinor, balanceMinor], properties: { id: { type: string }, name: { type: string }, kind: { type: string, enum: [CASH, CHECKING] }, archived: { type: boolean }, openingBalanceMinor: { type: integer }, balanceMinor: { type: integer } } }
    AccountInput: { type: object, required: [name, kind], additionalProperties: false, properties: { name: { type: string, minLength: 1 }, kind: { type: string, enum: [cash, checking] }, openingBalanceMinor: { type: integer } } }
    Category: { type: object, required: [id, name, archived], properties: { id: { type: string }, name: { type: string }, archived: { type: boolean } } }
    Budget: { type: object, required: [id, setupStep, timezone, version, accounts, accountBalanceMinor, account, categories], properties: { id: { type: string }, setupStep: { type: string, enum: [ACCOUNT, CATEGORIES, COMPLETE] }, timezone: { type: string, enum: [UTC] }, version: { type: integer }, accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }, accountBalanceMinor: { type: integer }, account: { nullable: true, allOf: [{ $ref: '#/components/schemas/Account' }] }, categories: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
    Rta: { type: object, required: [amountMinor, openingBalanceMinor, releasedIncomeMinor, unreleasedIncomeMinor, priorCarryMinor, assignedMinor], properties: { amountMinor: { type: integer }, openingBalanceMinor: { type: integer }, releasedIncomeMinor: { type: integer }, unreleasedIncomeMinor: { type: integer }, priorCarryMinor: { type: integer }, assignedMinor: { type: integer } } }
    CategorySummary: { allOf: [{ $ref: '#/components/schemas/Category' }], type: object, properties: { carryoverMinor: { type: integer }, assignedMinor: { type: integer }, activityMinor: { type: integer }, availableMinor: { type: integer } } }
    FinancialSummary: { type: object, required: [month, accountBalanceMinor, accounts, rta, categories, version], properties: { month: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }, accountBalanceMinor: { type: integer }, accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }, rta: { $ref: '#/components/schemas/Rta' }, categories: { type: array, items: { $ref: '#/components/schemas/CategorySummary' } }, version: { type: integer } } }
    RegisterInput: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 } } }
    SignInInput: { $ref: '#/components/schemas/RegisterInput' }
    SetupInput: { type: object, properties: { openingBalanceMinor: { type: integer }, accountName: { type: string }, accountType: { type: string, enum: [cash, checking] }, categories: { type: array, items: { type: string } } } }
    NameInput: { type: object, required: [name], properties: { name: { type: string } } }
    Money: { type: integer, minimum: 1, description: Positive integer minor-unit amount. }
    Payee: { type: string, maxLength: 200, description: Trimmed Unicode text; null clears the value., nullable: true }
    Memo: { type: string, maxLength: 1000, description: Trimmed Unicode text; null clears the value., nullable: true }
    IncomeInput: { type: object, required: [amountMinor], additionalProperties: false, properties: { amountMinor: { $ref: '#/components/schemas/Money' }, accountId: { type: string }, date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' } } }
    SpendingInput: { type: object, required: [amountMinor, categoryId], additionalProperties: false, properties: { amountMinor: { $ref: '#/components/schemas/Money' }, categoryId: { type: string }, accountId: { type: string }, date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' } } }
    TransferInput: { type: object, required: [sourceAccountId, destinationAccountId, amountMinor, date], additionalProperties: false, properties: { sourceAccountId: { type: string }, destinationAccountId: { type: string }, amountMinor: { type: integer, minimum: 1 }, date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$', format: date }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' } } }
    AllocationInput: { type: object, required: [categoryId, amountMinor, month], properties: { categoryId: { type: string }, amountMinor: { $ref: '#/components/schemas/Money' }, month: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' } } }
    MoveInput: { type: object, required: [sourceCategoryId, destinationCategoryId, amountMinor, month], properties: { sourceCategoryId: { type: string }, destinationCategoryId: { type: string }, amountMinor: { $ref: '#/components/schemas/Money' }, month: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' } } }
    TransactionEditInput: { type: object, minProperties: 1, additionalProperties: false, properties: { amountMinor: { $ref: '#/components/schemas/Money' }, date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }, categoryId: { type: string }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' } } }
    TransactionDeleteInput: { type: object, required: [confirmed], properties: { confirmed: { type: boolean, enum: [true] }, reason: { type: string } } }
    TransactionHistoryItem: { type: object, required: [transactionId, kind, date, amountMinor, payee, memo, state], properties: { transactionId: { type: string }, kind: { type: string, enum: [INCOME, SPENDING] }, date: { type: string, format: date }, amountMinor: { type: integer }, accountId: { type: string }, category: { nullable: true, allOf: [{ $ref: '#/components/schemas/Category' }] }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' }, createdAt: { type: string }, state: { type: string, enum: [ELIGIBLE, PROTECTED] } } }
    TransferHistoryItem: { type: object, required: [transactionId, kind, date, amountMinor, sourceAccount, destinationAccount, payee, memo, createdAt], properties: { transactionId: { type: string }, kind: { type: string, enum: [TRANSFER] }, date: { type: string, format: date }, amountMinor: { type: integer, minimum: 1 }, sourceAccount: { $ref: '#/components/schemas/AccountReference' }, destinationAccount: { $ref: '#/components/schemas/AccountReference' }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' }, createdAt: { type: string, format: date-time } } }
    AccountReference: { type: object, required: [id, name, kind, archived], properties: { id: { type: string }, name: { type: string }, kind: { type: string, enum: [CASH, CHECKING] }, archived: { type: boolean } } }
    TransactionListResult: { type: object, required: [items, version], properties: { items: { type: array, items: { oneOf: [{ $ref: '#/components/schemas/TransactionHistoryItem' }, { $ref: '#/components/schemas/TransferHistoryItem' }] } }, version: { type: integer } } }
    TransactionResult: { type: object, required: [item, version], properties: { item: { oneOf: [{ $ref: '#/components/schemas/TransactionHistoryItem' }, { $ref: '#/components/schemas/TransferHistoryItem' }] }, version: { type: integer } } }
    DeleteResult: { type: object, required: [id, deleted, version], properties: { id: { type: string }, deleted: { type: boolean, enum: [true] }, version: { type: integer } } }
    IncomeResult: { type: object, required: [id, amountMinor, payee, memo, released, accountBalanceMinor, version], properties: { id: { type: string }, amountMinor: { type: integer }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' }, released: { type: boolean }, accountBalanceMinor: { type: integer }, version: { type: integer } } }
    ReleaseResult: { type: object, required: [incomeId, releasedNowMinor, released, version], properties: { incomeId: { type: string }, releasedNowMinor: { type: integer }, released: { type: boolean }, version: { type: integer } } }
    SpendingResult: { type: object, required: [id, amountMinor, categoryId, month, payee, memo, accountBalanceMinor, version], properties: { id: { type: string }, amountMinor: { type: integer }, categoryId: { type: string }, month: { type: string }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' }, accountBalanceMinor: { type: integer }, version: { type: integer } } }
    AccountResult: { type: object, required: [account, version], properties: { account: { $ref: '#/components/schemas/Account' }, version: { type: integer } } }
    TransferResult: { type: object, required: [transferId, sourceAccountId, destinationAccountId, amountMinor, date, payee, memo, sourceAccount, destinationAccount, accountBalanceMinor, version], properties: { transferId: { type: string }, sourceAccountId: { type: string }, destinationAccountId: { type: string }, amountMinor: { type: integer, minimum: 1 }, date: { type: string, format: date }, payee: { $ref: '#/components/schemas/Payee' }, memo: { $ref: '#/components/schemas/Memo' }, sourceAccount: { $ref: '#/components/schemas/Account' }, destinationAccount: { $ref: '#/components/schemas/Account' }, accountBalanceMinor: { type: integer }, version: { type: integer } } }
    AllocationResult: { type: object, required: [id, categoryId, amountMinor, rtaMinor, assignedMinor, version], properties: { id: { type: string }, categoryId: { type: string }, amountMinor: { type: integer }, rtaMinor: { type: integer }, assignedMinor: { type: integer }, previousRtaMinor: { type: integer }, version: { type: integer } } }
    MoveResult: { type: object, required: [id, source, destination, amountMinor, version], properties: { id: { type: string }, source: { type: object, properties: { assignedMinor: { type: integer } } }, destination: { type: object, properties: { assignedMinor: { type: integer } } }, amountMinor: { type: integer }, version: { type: integer } } }
    FinancialResult: { oneOf: [{ $ref: '#/components/schemas/IncomeResult' }, { $ref: '#/components/schemas/ReleaseResult' }, { $ref: '#/components/schemas/SpendingResult' }, { $ref: '#/components/schemas/AllocationResult' }, { $ref: '#/components/schemas/MoveResult' }, { $ref: '#/components/schemas/TransferResult' }] }
    UserEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { $ref: '#/components/schemas/User' } } }
    SessionEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { $ref: '#/components/schemas/Session' } } }
    EmptyEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { nullable: true } } }
    BudgetEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { $ref: '#/components/schemas/Budget' } } }
    AccountEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { $ref: '#/components/schemas/AccountResult' } } }
    TransferEnvelope: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }], properties: { data: { $ref: '#/components/schemas/TransferResult' } } }
