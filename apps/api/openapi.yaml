openapi: 3.0.3
info:
  title: YNAB first-slice API
  version: 1.0.0
  description: >-
    The bounded slice supports cash and checking accounts, account lifecycle,
    same-budget transfers, categories, realized income, explicit income release,
    categorized spending, assignments, unassignments, moves, monthly summaries,
    dashboard values, and transaction history. Splits, cards, reconciliation, targets,
    scheduled transactions, future income, refunds, reimbursements, returns, and
    cleared/pending/uncleared states remain unsupported and are not part of this contract.
servers:
  - url: /
paths:
  /api/v1/auth/register:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      summary: Register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/UserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/sign-in:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      summary: Sign in
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignInInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/SessionSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/sign-out:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      summary: Revoke the session cookie when present
      description: The sid cookie is optional; the server returns success and clears it.
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
  /api/v1/budgets:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      summary: Resume the authenticated owner's budget
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create the authenticated owner's budget
      security: [{ cookieAuth: [] }]
      responses:
        '201': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    get:
      summary: Read a budget
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save resumable setup state
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/accounts:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Create a manual account after setup
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/AccountSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/accounts/{accountId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    patch:
      summary: Rename an account
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/AccountSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/accounts/{accountId}/archive:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Archive an account; unarchive is not supported
      security: [{ cookieAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, maxProperties: 0 } } } }
      responses:
        '200': { $ref: '#/components/responses/AccountSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/categories:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    post:
      summary: Create a category
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/BudgetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/categories/{categoryId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/CategoryId' }]
    patch:
      summary: Rename a category
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/categories/{categoryId}/archive:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/CategoryId' }]
    post:
      summary: Archive a category
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/BudgetSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/income:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Record realized income
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IncomeInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/income/{incomeId}/release:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IncomeId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Explicitly release full income
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/spending:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Record categorized spending
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpendingInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/transfers:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/RequiredIfMatch' }]
    post:
      summary: Record a same-budget account transfer
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/TransferSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/transactions:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }]
    get:
      summary: List effective transaction history
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/MonthOptional' }, { $ref: '#/components/parameters/HistoryAccount' }, { $ref: '#/components/parameters/HistoryKind' }, { $ref: '#/components/parameters/HistoryCategory' }, { $ref: '#/components/parameters/HistoryFrom' }, { $ref: '#/components/parameters/HistoryTo' }, { $ref: '#/components/parameters/HistoryQuery' }]
      responses:
        '200': { $ref: '#/components/responses/TransactionListSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/transactions/{transactionId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/TransactionId' }]
    get:
      summary: Read one effective transaction
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/TransactionSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit an eligible transaction
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionEditInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/TransactionSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete an eligible transaction after explicit confirmation
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionDeleteInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/DeleteSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/allocations:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Assign money
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/allocations/unassign:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Unassign money
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/allocations/move:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
    post:
      summary: Move assignment between categories
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoveInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/FinancialSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/budgets/{budgetId}/summary:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/Month' }]
    get:
      summary: Read the canonical monthly financial summary
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SummarySuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/budgets/{budgetId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/BudgetId' }, { $ref: '#/components/parameters/Month' }]
    get:
      summary: Read canonical dashboard values
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SummarySuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly SameSite=Lax Path=/ session cookie; Secure is added in production.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID; every success and error envelope returns requestId.
      schema: { type: string }
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    IncomeId:
      name: incomeId
      in: path
      required: true
      schema: { type: string }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string }
    Month:
      name: month
      in: query
      required: true
      description: Monthly view in YYYY-MM format.
      schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
    MonthOptional:
      name: month
      in: query
      required: false
      description: Optional history filter in YYYY-MM format; repeated or unknown query keys are rejected.
      schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
    HistoryAccount: { name: account, in: query, required: false, description: Canonical server-owned account UUID; transfers match either side., schema: { type: string, format: uuid } }
    HistoryKind: { name: kind, in: query, required: false, schema: { type: string, enum: [INCOME, SPENDING, TRANSFER] } }
    HistoryCategory: { name: category, in: query, required: false, description: Canonical server-owned category UUID., schema: { type: string, format: uuid } }
    HistoryFrom: { name: from, in: query, required: false, description: Inclusive YYYY-MM-DD lower bound., schema: { type: string, format: date, pattern: '^\\d{4}-\\d{2}-\\d{2}$' } }
    HistoryTo: { name: to, in: query, required: false, description: Inclusive YYYY-MM-DD upper bound., schema: { type: string, format: date, pattern: '^\\d{4}-\\d{2}-\\d{2}$' } }
    HistoryQuery: { name: q, in: query, required: false, description: Literal case-insensitive substring over metadata and current server names; maximum 200 Unicode code points., schema: { type: string, maxLength: 200 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for financial commands; the same key and payload replay the stored result.
      schema: { type: string, minLength: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional expected version for legacy-compatible commands; stale expected versions return 409. Weak or quoted integer ETags are accepted.
      schema: { type: string }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Required expected budget version for account and transfer commands. Weak or quoted integer ETags are accepted.
      schema: { type: string, pattern: '^(W/)?"?[0-9]+"?$' }
  responses:
    UserSuccess: { description: Registered user, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    SessionSuccess: { description: Authenticated session; also sets the sid cookie, headers: { Set-Cookie: { description: Session cookie, schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
    EmptySuccess: { description: Session revoked and cookie cleared, headers: { Set-Cookie: { description: Cleared session cookie, schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } } } }
    BudgetSuccess: { description: Budget state, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetEnvelope' } } } }
    AccountSuccess: { description: Account mutation result, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
    TransferSuccess: { description: Transfer result, content: { application/json: { schema: { $ref: '#/components/schemas/TransferEnvelope' } } } }
    FinancialSuccess: { description: Financial command result, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialEnvelope' } } } }
    TransactionListSuccess: { description: Effective transaction history, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionListEnvelope' } } } }
    TransactionSuccess: { description: Effective transaction result, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionEnvelope' } } } }
    DeleteSuccess: { description: Deleted transaction result, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteEnvelope' } } } }
    SummarySuccess: { description: Monthly summary, content: { application/json: { schema: { $ref: '#/components/schemas/SummaryEnvelope' } } } }
    ValidationError: { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthenticated: { description: Authentication required or credentials invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: State or concurrency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    InternalError: { description: Unexpected internal failure, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string, minLength: 1, description: Non-empty request ID }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, enum: [UNAUTHENTICATED, NOT_FOUND, CONFLICT, VALIDATION_ERROR, INTERNAL_ERROR] }
            message: { type: string }
            requestId: { type: string, minLength: 1, description: Non-empty request ID }
    User: { type: object, required: [id, email], properties: { id: { type: string }, email: { type: string, format: email } } }
    Session: { type: object, required: [user, sessionToken], properties: { user: { $ref: '#/components/schemas/User' }, sessionToken: { type: string, description: Opaque session token returned for this first slice } } }
    Account: { type: object, required: [id, name, kind, archived, openingBalanceMinor, balanceMinor], properties: { id: { type: string }, name: { type: string }, kind: { type: string, enum: [CASH, CHECKING] }, archived: { type: boolean }, openingBalanceMinor: { type: integer }, balanceMinor: { type: integer } } }
    AccountInput: { type: object, required: [name, kind], additionalProperties: false, properties: { name: { type: string, minLength: 1 }, kind: { type: string, enum: [cash, checking] }, openingBalanceMinor: { type: integer } } }
    Category: { type: object, required: [id, name, archived], properties: { id: { type: string }, name: { type: string }, archived: { type: boolean } } }
    Budget: { type: object, required: [id, setupStep, timezone, version, accounts, accountBalanceMinor, account, categories], properties: { id: { type: string }, setupStep: { type: string, enum: [ACCOUNT, CATEGORIES, COMPLETE] }, timezone: { type: string, enum: [UTC] }, version: { type: integer }, accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }, accountBalanceMinor: { type: integer }, account: { nullable: true, allOf: [{ $ref: '#/components/schemas/Account' }] }, categories: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
    Rta: { type: object, required: [amountMinor, openingBalanceMinor, releasedIncomeMinor, unreleasedIncomeMinor, priorCarryMinor, assignedMinor], properties: { amountMinor: { type: integer }, openingBalanceMinor: { type: integer }, releasedIncomeMinor: { type: integer }, unreleasedIncomeMinor: { type: integer }, priorCarryMinor: { type: integer }, assignedMinor: { type: integer } } }
    CategorySummary: { allOf: [{ $ref: '#/components/schemas/Category' }], type: object, properties: { carryoverMinor: { type: integer }, assignedMinor: { type: integer }, activityMinor: { type: integer }, availableMinor: { type: integer } } }
